name: touchtech_competitions
description: Competitions, fixtures, and results module for Touch Technology Framework
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  touchtech_core:
    path: ../touchtech_core
  touchtech_news:
    path: ../touchtech_news
  touchtech_clubs:
    path: ../touchtech_clubs
  touchtech_favorites:
    path: ../touchtech_favorites
  flutter_riverpod: ^2.5.1
  http: ^1.1.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  build_runner: ^2.4.13
  mockito: ^5.4.4
