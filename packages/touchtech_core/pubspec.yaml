name: touchtech_core
description: Core services and utilities for Touch Technology Framework
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.1.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.0.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^2.4.6
  path_provider: ^2.1.4
  path: ^1.9.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  visibility_detector: ^0.4.0+2
  flutter_html: ^3.0.0-beta.2
  touchtech_news:
    path: ../touchtech_news
  touchtech_clubs:
    path: ../touchtech_clubs
  touchtech_competitions:
    path: ../touchtech_competitions
  touchtech_favorites:
    path: ../touchtech_favorites

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0
  freezed: ^2.5.7
